# Static Traefik config — the environment-independent part. At container
# start, entrypoint.sh copies this file and appends the
# `certificatesResolvers` block for the chosen TLS_CHALLENGE (Traefik ignores
# CLI flags whenever a config file is used, and never interpolates env vars
# inside it, so rendering is the only way to make ACME settings come from
# infra/.env).
#
# No Docker-socket provider is used on purpose — all routing is rendered
# into the file provider from env by entrypoint.sh, so Traefik never needs
# docker.sock mounted (it can't enumerate or control other containers).
global:
  checkNewVersion: false
  sendAnonymousUsage: false

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
    forwardedHeaders:
      trustedIPs: &cloudflare_ips
        # Cloudflare's published proxy IP ranges (https://www.cloudflare.com/ips/).
        # Only relevant once DNS is switched to Cloudflare's proxied (orange-cloud)
        # mode per docs/SECURITY.md — until then this list is harmless (Traefik
        # only trusts X-Forwarded-For from these IPs; anyone else's is ignored,
        # so real client IPs still resolve correctly from a direct connection).
        # Keep this list in sync with Cloudflare's page if it changes.
        - 173.245.48.0/20
        - 103.21.244.0/22
        - 103.22.200.0/22
        - 103.31.4.0/22
        - 141.101.64.0/18
        - 108.162.192.0/18
        - 190.93.240.0/20
        - 188.114.96.0/20
        - 197.234.240.0/22
        - 198.41.128.0/17
        - 162.158.0.0/15
        - 104.16.0.0/13
        - 104.24.0.0/14
        - 172.64.0.0/13
        - 131.0.72.0/22
        - 2400:cb00::/32
        - 2606:4700::/32
        - 2803:f800::/32
        - 2405:b500::/32
        - 2405:8100::/32
        - 2a06:98c0::/29
        - 2c0f:f248::/32
  websecure:
    address: ":443"
    forwardedHeaders:
      trustedIPs: *cloudflare_ips

providers:
  file:
    # Rendered by entrypoint.sh inside the container (not a bind mount), so
    # edits to infra/traefik/dynamic/* take effect on container restart.
    directory: /etc/traefik/dynamic
    watch: false

# Liveness endpoint on the internal :8080 `traefik` entrypoint (never
# published) — used by the compose healthcheck.
ping: {}

log:
  level: INFO

# JSON access log so fail2ban (docs/SECURITY.md) can pattern-match repeated
# 401/429 responses per source IP and ban at the host firewall. Not enabled
# by default in Traefik.
accessLog:
  format: json
  filePath: /var/log/traefik/access.log
