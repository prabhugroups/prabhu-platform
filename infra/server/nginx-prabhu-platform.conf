# Host nginx in front of the platform — for servers where nginx already owns
# ports 80/443 (e.g. alongside mailcow / Nextcloud AIO). Pairs with
# TLS_CHALLENGE=external and TRAEFIK_HTTP_BIND=127.0.0.1:8880 in infra/.env.
# See docs/TRAEFIK.md, "Behind an existing reverse proxy".
#
# Install:
#   1. Replace every `example.com` with your BASE_DOMAIN.
#   2. Get the wildcard certificate (the docs show the certbot command).
#   3. cp nginx-cloudflare-realip.conf to /etc/nginx/snippets/cloudflare-realip.conf
#   4. cp this file to /etc/nginx/sites-available/prabhu-platform.conf, symlink
#      it into /etc/nginx/sites-enabled/, then: nginx -t && systemctl reload nginx
#
# Your other sites keep working: nginx always prefers an exact server_name
# (mail.example.com, cloud.example.com) over the wildcard below. Just don't
# give a tenant a slug that matches one of those names.

upstream prabhu_platform {
    server 127.0.0.1:8880;   # = TRAEFIK_HTTP_BIND
    keepalive 16;
}

# HTTP -> HTTPS for every tenant subdomain, the Super Admin host and the bare
# domain. The bare domain is forwarded too: with SUPER_ADMIN_DOMAIN set to it
# in infra/.env it opens the console; otherwise Traefik answers it with 404,
# rather than nginx falling through to another site (e.g. mailcow's UI).
server {
    listen 80;
    listen [::]:80;
    server_name example.com *.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com *.example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    # Media uploads go up to 25MB (Traefik's own edge limit is 26MB).
    client_max_body_size 26m;

    # Visitor IP from Cloudflare's header, only for connections from
    # Cloudflare's ranges (scoped to this server block, not your other sites).
    include snippets/cloudflare-realip.conf;

    location / {
        proxy_pass http://prabhu_platform;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # SET, not append ($proxy_add_x_forwarded_for): the visitor's address
        # must be the only entry, or clients could spoof their IP and dodge
        # the per-visitor rate limits and login lockout. Behind Cloudflare,
        # $remote_addr is already the visitor (cloudflare-realip.conf above).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }
}

