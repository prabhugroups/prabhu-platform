# Local-development convenience only — never used in production.
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build

services:
  mysql:
    ports:
      - "3306:3306"

  backend:
    ports:
      - "8000:8000"

  frontend:
    ports:
      - "3000:3000"

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - mysql
