name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Re-run the full pipeline (tests -> publish -> deploy) for the current main,
  # optionally deploying to a single company's environment only.
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy only this environment (e.g. prabhu). Empty = every DEPLOY_TARGETS entry."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: prabhu_platform_test
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Create app + test databases
        run: |
          mysql -h127.0.0.1 -uroot -e "CREATE DATABASE IF NOT EXISTS prabhu_platform;"
          mysql -h127.0.0.1 -uroot -e "CREATE USER IF NOT EXISTS 'prabhu_platform'@'%' IDENTIFIED BY 'ci-password';"
          mysql -h127.0.0.1 -uroot -e "GRANT ALL PRIVILEGES ON prabhu_platform.* TO 'prabhu_platform'@'%';"
          mysql -h127.0.0.1 -uroot -e "GRANT ALL PRIVILEGES ON prabhu_platform_test.* TO 'prabhu_platform'@'%';"
      - name: Alembic migrate
        env:
          DB_HOST: 127.0.0.1
          DB_USER: prabhu_platform
          DB_PASSWORD: ci-password
          JWT_SECRET: ci-only-secret
        run: alembic upgrade head
      - name: pytest
        env:
          DB_HOST: 127.0.0.1
          DB_USER: prabhu_platform
          DB_PASSWORD: ci-password
          JWT_SECRET: ci-only-secret
        run: pytest -q
      - name: bandit
        run: bandit -r app
      - name: pip-audit
        run: pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      # Blocking: what ships in the image. Dev tooling (eslint, shadcn CLI)
      # only runs at build time on trusted input, and can carry advisories
      # with no fixed version yet — reported below without failing the build.
      - run: npm audit --omit=dev --audit-level=high
      - name: npm audit (dev tooling, report only)
        run: npm audit --audit-level=high || echo "::warning::npm audit found high-severity advisories in dev dependencies"
      - name: build
        env:
          INTERNAL_API_URL: http://127.0.0.1:8000
        run: npm run build

  # Builds both images once and pushes them to GHCR, tagged with the commit
  # SHA (immutable — what gets deployed and rolled back to) and `latest`.
  publish-images:
    needs: [backend, frontend]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          # GHCR names must be lowercase; the owner may not be.
          images: ghcr.io/${{ github.repository_owner }}/prabhu-platform-${{ matrix.service }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # One deployment per company. Each is a GitHub Environment (Settings →
  # Environments) named after the company, holding that company's server
  # (DEPLOY_HOST, DEPLOY_USER, ... variables; DEPLOY_SSH_KEY, ... secrets)
  # and its own protection rules. The DEPLOY_TARGETS repository variable
  # lists which environments every push to main deploys, as a JSON array:
  # ["prabhu"]  or  ["prabhu", "acme"]. Skipped while it's unset.
  #
  # Per target: ships this commit's infra files (compose + Traefik) to the
  # server, points it at the just-published images via IMAGE_TAG in the
  # server's infra/.env, pulls, runs migrations and swaps containers. The
  # server holds no git clone — only infra/ and its own .env (domains,
  # tenants, secrets), which CI never overwrites beyond the IMAGE_TAG line.
  deploy:
    needs: [publish-images]
    if: >-
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      (inputs.target != '' || vars.DEPLOY_TARGETS != '')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # one company's failed deploy never cancels another's
      matrix:
        target: ${{ fromJSON(inputs.target != '' && format('["{0}"]', inputs.target) || vars.DEPLOY_TARGETS) }}
    environment: ${{ matrix.target }}
    concurrency:
      group: deploy-${{ matrix.target }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check environment configuration
        env:
          HOST: ${{ vars.DEPLOY_HOST }}
          USER: ${{ vars.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          missing=""
          [ -n "$HOST" ] || missing="$missing DEPLOY_HOST(variable)"
          [ -n "$USER" ] || missing="$missing DEPLOY_USER(variable)"
          [ -n "$KEY" ] || missing="$missing DEPLOY_SSH_KEY(secret)"
          if [ -n "$missing" ]; then
            echo "::error::Environment '${{ matrix.target }}' is missing:$missing"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          sparse-checkout: infra
      # Uploaded to a staging dir first (wiped each time) so files deleted
      # from the repo also disappear from the server.
      - name: Upload infra files
        uses: appleboy/scp-action@v1
        with:
          host: ${{ vars.DEPLOY_HOST }}
          port: ${{ vars.DEPLOY_PORT || 22 }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: ${{ secrets.DEPLOY_SSH_FINGERPRINT }}
          source: infra/docker-compose.yml,infra/traefik
          target: ${{ vars.DEPLOY_PATH || '/opt/prabhu-platform' }}/.release
          rm: true
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ github.sha }}
          # Short-lived (expires with this job) — no long-lived registry
          # credential ever needs to live on the server.
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/prabhu-platform' }}
        with:
          host: ${{ vars.DEPLOY_HOST }}
          port: ${{ vars.DEPLOY_PORT || 22 }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: ${{ secrets.DEPLOY_SSH_FINGERPRINT }}
          envs: IMAGE_TAG,GHCR_TOKEN,GHCR_USER,DEPLOY_PATH
          script_stop: true
          script: |
            set -eu
            cd "$DEPLOY_PATH"
            test -f infra/.env || { echo "infra/.env missing on server — create it first"; exit 1; }

            # Compose/Traefik config at exactly the commit being deployed.
            cp .release/infra/docker-compose.yml infra/docker-compose.yml
            rm -rf infra/traefik
            cp -R .release/infra/traefik infra/traefik
            chmod +x infra/traefik/entrypoint.sh

            cd infra

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            IMAGE_TAG="$IMAGE_TAG" docker compose pull --quiet
            docker logout ghcr.io

            # Pin the release in .env only once its images are on the box.
            PREVIOUS=$(sed -n 's/^IMAGE_TAG=//p' .env)
            if grep -q '^IMAGE_TAG=' .env; then
              sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$IMAGE_TAG/" .env
            else
              printf '\nIMAGE_TAG=%s\n' "$IMAGE_TAG" >> .env
            fi
            echo "$(date -u +%FT%TZ) $IMAGE_TAG (previous: ${PREVIOUS:-none})" >> .deploy-history

            docker compose up -d --wait --no-build --remove-orphans
            docker compose ps

            # Old release images stay pullable from GHCR; keep a week locally.
            # Label-scoped: never touches other stacks' images on a shared host.
            docker image prune -af --filter "until=168h" \
              --filter "label=org.opencontainers.image.source=https://github.com/${{ github.repository }}" >/dev/null
