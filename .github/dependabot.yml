# Existing CI (.github/workflows/ci.yml) catches known CVEs in whatever's
# already pinned at PR time via bandit/pip-audit/npm audit — nothing
# proactively opens a PR to bump a vulnerable or outdated version between
# runs. This closes that gap. Weekly (not daily): this is a low-churn CMS
# for 7 corporate sites, not a fast-moving app — no reason to generate more
# review noise than that.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
